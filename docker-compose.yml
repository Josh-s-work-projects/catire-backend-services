services:
  # --- BASES DE DATOS ---
  catire_postgres_db:
    image: postgres:15-alpine
    container_name: catire_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catire_core_db 
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d 
    networks:
      - t4_network

  # --- MONGODB ---
  catire_audit_db:
    image: mongo:6-jammy
    container_name: catire_audit_db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - audit_mongo_data:/data/db
    networks:
      - t4_network

  catire_config_db:
    image: mongo:6-jammy
    container_name: catire_config_db
    volumes:
      - config_mongo_data:/data/db
    networks:
      - t4_network

  # --- MICROSERVICIOS ---
  auth-service:
    container_name: auth-service
    hostname: auth-service
    build: 
      context: ./auth-service
      dockerfile: ../Dockerfile.dev
    init: true
    volumes:
      - ./auth-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_auth_db
      - JWT_SECRET=${JWT_SECRET}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - catire_postgres_db
    networks:
      - t4_network

  catalog-service:
    container_name: catalog-service
    hostname: catalog-service
    build: 
      context: ./catalog-service
      dockerfile: ../Dockerfile.dev
    init: true
    volumes:
      - ./catalog-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_catalog_db
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - catire_postgres_db
    networks:
      - t4_network

  order-service:
    container_name: order-service
    hostname: order-service
    build: 
      context: ./order-service
      dockerfile: ../Dockerfile.dev
    init: true
    volumes:
      - ./order-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - 'MONGO_URL=mongodb://catire_audit_db:27017/catire_order_db?replicaSet=rs0&retryWrites=true&w=majority'
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - catire_audit_db
    networks:
      - t4_network

  finance-config-service:
    container_name: finance-config-service
    hostname: finance-config-service
    build: 
      context: ./finance-config-service
      dockerfile: ../Dockerfile.dev
    init: true
    volumes:
      - ./finance-config-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - MONGO_URL=mongodb://catire_config_db:27017/catire_finance_config_db
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - catire_config_db
    networks:
      - t4_network

  api-gateway:
    image: nginx:alpine
    container_name: api_gateway_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - finance-config-service
    networks:
      - t4_network

networks:
  t4_network:
    driver: bridge

volumes:
  pg_data:
  audit_mongo_data:
  config_mongo_data: