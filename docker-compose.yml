version: '3.8'

services:
  # --- BASES DE DATOS ---
  catire_postgres_db:
    image: postgres:15-alpine
    container_name: catire_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catire_core_db 
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d 
    networks:
      - t4_network

  # --- MONGODB ---
  catire_audit_db:
    image: mongo:6-jammy
    container_name: catire_audit_db
    networks:
      - t4_network

  catire_config_db:
    image: mongo:6-jammy
    container_name: catire_config_db
    networks:
      - t4_network

  # --- MICROSERVICIOS ---
  auth-service:
    build: 
      context: ./auth-service
      dockerfile: ../Dockerfile.dev
    volumes:
      - ./auth-service:/usr/src/app
    environment:
      # Nota que ahora todos apuntan a 'catire_postgres_db'
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_auth_db
    depends_on:
      - catire_postgres_db
    networks:
      - t4_network

  catalog-service:
    build: 
      context: ./catalog-service
      dockerfile: ../Dockerfile.dev
    volumes:
      - ./catalog-service:/usr/src/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_catalog_db
    depends_on:
      - catire_postgres_db
    networks:
      - t4_network

  order-service:
    build: 
      context: ./order-service
      dockerfile: ../Dockerfile.dev
    volumes:
      - ./order-service:/usr/src/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_order_db
      - MONGO_URL=mongodb://catire_audit_db:27017/catire_order_db
    depends_on:
      - catire_postgres_db
      - catire_audit_db
    networks:
      - t4_network

  finance-config-service:
    build: 
      context: ./finance-config-service
      dockerfile: ../Dockerfile.dev
    volumes:
      - ./finance-config-service:/usr/src/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catire_postgres_db:5432/catire_finance_config_db
      - MONGO_URL=mongodb://catire_config_db:27017/catire_finance_config_db
    depends_on:
      - catire_postgres_db
      - catire_config_db
    networks:
      - t4_network

  api-gateway:
    image: nginx:alpine
    container_name: api_gateway_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - finance-config-service
    networks:
      - t4_network

networks:
  t4_network:
    driver: bridge

volumes:
  pg_data: