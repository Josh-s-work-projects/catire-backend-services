version: '3.8'

services:
  # --- BASES DE DATOS ---
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - t4_network

  mongo_db:
    image: mongo:6-jammy
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    networks:
      - t4_network

  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - t4_network

  # --- MICROSERVICIOS (NESTJS) ---
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service
    command: npm run start:dev auth-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis_cache
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - t4_network

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: catalog-service
    command: npm run start:dev catalog-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - t4_network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: order-service
    command: npm run start:dev order-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:${POSTGRES_PORT}/${POSTGRES_DB}
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo_db:27017/orders_db?authSource=admin
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - mongo_db
      - redis_cache
    networks:
      - t4_network

  finance-config-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: finance-service
    command: npm run start:dev finance-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis_cache
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - t4_network

  # --- API GATEWAY ---
  api-gateway:
    image: nginx:alpine
    container_name: api_gateway_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - finance-config-service
    networks:
      - t4_network

networks:
  t4_network:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  redis_data: