worker_processes auto;

events { 
  worker_connections 1024; 
}

http {
  resolver 127.0.0.11 valid=5s;
  
  sendfile on;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
      set $auth_service auth-service;
      proxy_pass http://$auth_service:3000/;
    }

    location /api/catalog/ {
      set $catalog_service catalog-service;
      proxy_pass http://$catalog_service:3000/;
    }

    location /api/orders/ {
      set $order_service order-service;
      proxy_pass http://$order_service:3000/;
    }

    location /api/finance/ {
      set $finance_config_service finance-config-service;
      proxy_pass http://$finance_config_service:3000/;
    }
  }
}